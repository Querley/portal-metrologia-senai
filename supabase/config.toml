project_id = "portal-metrologia-senai"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "https://portal-metrologia-senai.querleyjuniorodrigue.chatgpt.site"
additional_redirect_urls = [
  "http://localhost:3000/**",
  "https://portal-metrologia-senai.querleyjuniorodrigue.chatgpt.site/**"
]
enable_signup = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1m"
otp_length = 8
otp_expiry = 3600

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[storage]
enabled = true
file_size_limit = "50MiB"

[realtime]
enabled = true
