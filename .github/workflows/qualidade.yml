name: Qualidade

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  ponta-a-ponta:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: evidencia-playwright
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  banco-e-rls:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Iniciar Supabase local com tolerância ao registro de imagens
        shell: bash
        run: |
          for tentativa in 1 2 3; do
            if supabase db start; then
              exit 0
            fi
            if [ "$tentativa" -lt 3 ]; then
              echo "Falha transitória ao iniciar o Supabase; nova tentativa em 45 segundos."
              supabase stop --no-backup || true
              sleep 45
            fi
          done
          exit 1
      - run: supabase db reset
      - run: supabase test db
